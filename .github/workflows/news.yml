name: Nova - Aksys and Otomate News

on:
  workflow_dispatch:
    inputs:
      send_test_message:
        description: Send test message without checking news
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: write

concurrency:
  group: nova-news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/argos-translate
            ~/.local/cache/argos-translate
          key: nova-argos-ja-en-v1-${{ runner.os }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check news and post
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SEND_TEST_MESSAGE: ${{ inputs.send_test_message || 'false' }}
        run: |
          if [[ "$SEND_TEST_MESSAGE" == "true" ]]; then
            python newsbot.py --test-webhook
          else
            python newsbot.py
          fi
      - name: Save seen news history
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: save posted news [skip ci]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
